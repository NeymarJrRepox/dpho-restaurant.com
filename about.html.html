<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Daftar dan Login</title>
<style>
*{box-sizing:border-box}html{min-height:100%;background:#000000}body{margin:0;min-height:100svh;background:#000000;color:#fff;font-family:Arial,Helvetica,sans-serif}#storm{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}.page{position:relative;z-index:1;width:min(100%,375px);margin:0 auto;padding:0 32px 25px;min-height:100svh;background:linear-gradient(180deg,#00000000 45%,#000000e8 76%,#000000c9);isolation:isolate}.poster{position:relative;width:100%;aspect-ratio:312/314;overflow:hidden;border-radius:20px 20px 0 0;background:#c58b10;box-shadow:0 0 30px #ffad0025}.poster img{position:absolute;display:block;width:120.1923077%;max-width:none;height:auto;left:-10.5769231%;top:-0.6369427%}.actions{display:grid;gap:9px;padding-top:25px}.action{display:flex;align-items:center;justify-content:center;min-height:57px;width:100%;border:1px solid #ec375b;border-radius:13px;color:#fff;font:700 16px Arial,sans-serif;cursor:pointer;text-align:center;box-shadow:inset 0 1px 0 #ffffff12,0 5px 20px #0002;transition:transform .15s,background .15s}.register{background:linear-gradient(110deg,#c41336,#a30024)}.login{background:linear-gradient(110deg,#36050e,#200207);color:#f6d8dc}.action:hover{transform:translateY(-2px);filter:brightness(1.12)}.action:focus-visible,.motion:focus-visible,.close:focus-visible{outline:3px solid #ffda71;outline-offset:4px}.motion{display:block;position:relative;z-index:1;margin:20px auto 0;border:1px solid #ffffff35;color:#ebc6ce;background:#310910ce;border-radius:20px;padding:7px 12px;font-size:10px;cursor:pointer}.page:before{content:'';position:absolute;inset:0;z-index:-1;box-shadow:0 0 90px #0004;pointer-events:none}dialog{width:min(340px,calc(100% - 40px));border:1px solid #d93655;border-radius:15px;background:#300710;color:#fff;padding:25px;box-shadow:0 15px 70px #0009}dialog::backdrop{background:#100006c9}dialog h1{font-size:19px;margin:0 0 12px}dialog p{font-size:13px;line-height:1.7;color:#efd0d5;margin:0 0 20px}.close{border:1px solid #ed4867;background:#ac0e2d;color:#fff;padding:10px 20px;border-radius:7px;cursor:pointer}@media(min-width:700px){.page{padding-top:25px;min-height:100svh}.poster{border-radius:20px 20px 0 0}}@media(max-width:340px){.page{padding-inline:20px}.action{font-size:14px}}@media(prefers-reduced-motion:reduce){.action{transition:none}#storm{opacity:.4}}

/* Crop the supplied screenshot to its poster only; fill mobile width. */
@media(max-width:699px){
  .page{width:min(100%,375px);max-width:375px;min-height:0;padding:0 32px 12px;overflow:hidden}
  .poster{width:100%;border-radius:20px 20px 0 0}
  .actions{padding:16px 0 0;gap:10px}
  .action{min-height:57px}
  .motion{margin-top:12px}
}
@media(max-width:340px){.page{padding-inline:20px}}

/* Center the content vertically while retaining space on short screens. */
body{display:flex;align-items:center;justify-content:center;min-height:100svh;padding-block:24px}
.page{min-height:0;padding-top:0;padding-bottom:0;margin:0 auto}
@media(min-width:700px){.page{min-height:0;padding-top:0;padding-bottom:0}}
@media(max-width:699px){.page{min-height:0;padding-top:0;padding-bottom:0}}
.poster.gambar-utuh{aspect-ratio:auto;background:transparent}.poster.gambar-utuh img{position:static;width:100%;height:auto;max-width:100%}

/* Larger poster area, responsive to the available screen width. */
.page{width:min(100%,460px);max-width:460px;padding-inline:20px}
@media(max-width:699px){.page{width:min(100%,460px);max-width:460px;padding-inline:16px}}
@media(max-width:340px){.page{padding-inline:12px}}

/* Fit the complete photo at its natural aspect ratio. */
.page{width:min(100%,680px);max-width:680px;padding-inline:16px}
.poster.gambar-utuh{width:100%;aspect-ratio:auto;overflow:hidden;border-radius:16px}
.poster.gambar-utuh img{display:block;position:static;width:100%;max-width:100%;height:auto;object-fit:contain}
@media(max-width:699px){.page{width:100%;max-width:680px;padding-inline:10px}}
@media(max-width:340px){.page{padding-inline:8px}}
</style>
</head>
<body>
<canvas id="storm" aria-hidden="true"></canvas>
<main class="page" aria-label="Halaman pendaftaran dan login">
<div class="poster"><img id="poster-image" src="image.png" alt="Poster promosi BRANI888 bertema emas dan Mahjong, dengan tulisan member baru, Mahjong Ways 1 dan 2, serta X500." width="375" height="488"></div>
<div class="actions"><button class="action register" id="register" type="button">DAFTAR SEKARANG</button><button class="action login" id="login" type="button">LOGIN SEKARANG</button></div>
<noscript><p>Aktifkan JavaScript untuk animasi petir dan tombol.</p></noscript>
</main>
<dialog id="notice" aria-labelledby="notice-title"><h1 id="notice-title">Tautan belum diatur</h1><p id="notice-text"></p><button type="button" class="close" id="close">Tutup</button></dialog>
<script>
/* ================================================
   UBAH LINK DAN TULISAN DI BAGIAN INI SAJA
   Ganti image.png dengan URL gambar pilihan kamu.
   Isi linkDaftar dan linkLogin dengan alamat tujuan.
   Jika gambar baru sudah berupa poster saja, ubah
   gambarDariScreenshot menjadi false agar tidak terpotong.
   ================================================ */
const pengaturan = {
  linkGambar: 'https://pixnow.cloud/images/2026/10/27/petjah.png',
  linkDaftar: 'https://brani888.click/googleads2',
  linkLogin: 'https://brani888.click/googleads2',
  tulisanDaftar: 'DAFTAR',
  tulisanLogin: 'LOGIN',
  gambarDariScreenshot: false
};
const posterImage = document.getElementById('poster-image');
posterImage.src = pengaturan.linkGambar;
document.getElementById('register').textContent = pengaturan.tulisanDaftar;
document.getElementById('login').textContent = pengaturan.tulisanLogin;
if (!pengaturan.gambarDariScreenshot) {
  posterImage.parentElement.classList.add('gambar-utuh');
}
const destinations={register:pengaturan.linkDaftar,login:pengaturan.linkLogin};
const notice=document.getElementById('notice');
for(const name of ['register','login'])document.getElementById(name).addEventListener('click',()=>{if(destinations[name]){window.location.assign(destinations[name]);return}document.getElementById('notice-text').textContent='Tautan '+(name==='register'?'pendaftaran':'login')+' belum ditambahkan pada halaman ini.';notice.showModal()});
document.getElementById('close').addEventListener('click',()=>notice.close());
const canvas=document.getElementById('storm'),ctx=canvas.getContext('2d');
const preference=window.matchMedia('(prefers-reduced-motion: reduce)');
let width=0,height=0,bolts=[],last=0,spawn=0,paused=preference.matches,frame=0;
const random=(min,max)=>min+Math.random()*(max-min);
function resize(){width=window.innerWidth;height=window.innerHeight;const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);ctx.setTransform(ratio,0,0,ratio,0,0);bolts=[];if(paused)drawStill()}
function makeBolt(){const x=random(-30,width+30),points=[{x,y:-40}];let y=-40,pos=x;while(y<height+80){y+=random(28,68);pos+=random(-45,45);points.push({x:pos,y})}const branches=[];for(let i=2;i<points.length-2;i++){if(Math.random()<.3){const root=points[i];branches.push([root,{x:root.x+random(-65,65),y:root.y+40},{x:root.x+random(-100,100),y:root.y+110}])}}return{points,branches,age:0,duration:random(1100,1800),thickness:random(4,8)}}
function path(points,limit){ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i];if(b.y<=limit){ctx.lineTo(b.x,b.y)}else if(a.y<limit){const t=(limit-a.y)/(b.y-a.y);ctx.lineTo(a.x+(b.x-a.x)*t,limit);break}else break}ctx.stroke()}
function paint(bolt,progress,opacity){const limit=-40+(height+160)*progress;ctx.globalAlpha=opacity;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#071f73';ctx.shadowColor='#123d9c';ctx.shadowBlur=24;ctx.lineWidth=bolt.thickness+7;path(bolt.points,limit);ctx.shadowBlur=12;ctx.strokeStyle='#173f94';ctx.lineWidth=bolt.thickness;path(bolt.points,limit);ctx.shadowBlur=0;ctx.strokeStyle='#3566b8';ctx.lineWidth=Math.max(1.5,bolt.thickness*.35);path(bolt.points,limit);ctx.strokeStyle='#183b82';ctx.lineWidth=2;for(const branch of bolt.branches)path(branch,limit);ctx.globalAlpha=1;ctx.shadowBlur=0}
function drawStill(){ctx.clearRect(0,0,width,height);for(let i=0;i<Math.max(3,Math.ceil(width/220));i++)paint(makeBolt(),1,.22)}
function animate(time){if(paused){frame=0;return}const elapsed=last?Math.min(time-last,60):16;last=time;spawn+=elapsed;ctx.clearRect(0,0,width,height);if(spawn>135){const count=width>700?2:1;for(let i=0;i<count;i++)bolts.push(makeBolt());spawn=0}for(const bolt of bolts){bolt.age+=elapsed;const t=bolt.age/bolt.duration;const opacity=Math.min(t*7,1)*Math.max(0,1-t);paint(bolt,Math.min(1,t*2.5),opacity*.8)}bolts=bolts.filter(b=>b.age<b.duration);frame=requestAnimationFrame(animate)}

function syncMotion(){}
function start(){last=0;spawn=150;if(!frame&&!paused&&!document.hidden)frame=requestAnimationFrame(animate)}
preference.addEventListener('change',event=>{paused=event.matches;syncMotion();if(paused){cancelAnimationFrame(frame);frame=0;drawStill()}else start()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0;last=0}else start()});
window.addEventListener('resize',resize);resize();syncMotion();start();
</script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"851a5562bd7f4cc8b197a4ff3041b0ca","r":1,"spa":2}' crossorigin="anonymous"></script>
</body>
</html>
